[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-project2"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torchvision>=0.17,<1", "Pillow>=10", "numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6", "albumentations==2.0.8"]

[project.optional-dependencies]
data = ["datasets>=3,<5"]
detection = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8", "typer>=0.12,<1", "pydantic>=2,<3", "tenacity>=8,<10", "rich>=13,<15"]
reports = ["matplotlib>=3.8,<4"]

[project.scripts]
furniture = "furniture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

id: C6
description: easy augmentation, strong occlusion, freeze 2
overrides:
  training:
    freeze_epochs: 2
  augmentation:
    backend: albumentations
    preset: easy
    params:
      horizontal_flip_p: 0.5
      affine_p: 0.3
      rotate_degrees: 5.0
      translate_fraction: 0.0
      scale:
      - 1.0
      - 1.0
      brightness_contrast_p: 0.3
      brightness_limit: 0.1
      contrast_limit: 0.1
      blur_p: 0.0
      blur_kernel: 3
    occlusion:
      preset: strong
      probability: 0.5
      holes:
      - 1
      - 3
      height_fraction:
      - 0.1
      - 0.25
      width_fraction:
      - 0.1
      - 0.25
      fill: 127

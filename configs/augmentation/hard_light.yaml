backend: albumentations
preset: hard
params:
  horizontal_flip_p: 0.5
  affine_p: 0.5
  rotate_degrees: 10.0
  translate_fraction: 0.05
  scale:
  - 0.9
  - 1.1
  brightness_contrast_p: 0.5
  brightness_limit: 0.2
  contrast_limit: 0.2
  blur_p: 0.15
  blur_kernel: 3
occlusion:
  preset: light
  probability: 0.25
  holes:
  - 1
  - 2
  height_fraction:
  - 0.05
  - 0.15
  width_fraction:
  - 0.05
  - 0.15
  fill: 127
